version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16        # Official PGVector image (includes the extension)
    container_name: docreader-postgres
    environment:
      POSTGRES_DB: docreader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql   # Auto-run on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
